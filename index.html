<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Singapore Space Atlas</title>
    <meta
      name="description"
      content="A visual, evidence-backed systems map of Singapore's space ecosystem — agencies, universities, companies, programmes and international partners."
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="wordmark">
        <h1>Singapore Space Atlas</h1>
        <p class="subtitle">A visual map of Singapore&rsquo;s space ecosystem</p>
      </div>
      <p class="layers" aria-hidden="true">
        Institutional context <span>·</span> Capability <span>·</span> Industry
        <span>·</span> International
      </p>
    </header>

    <main id="main">
      <!-- The interactive map mounts here (progressive enhancement). -->
      <section id="atlas" class="atlas" aria-label="Ecosystem map" hidden></section>

      <!-- No-JavaScript / fallback: the semantic catalogue is the resilient representation. -->
      <noscript>
        <div class="fallback">
          <p>
            <strong>Singapore Space Atlas</strong> — the interactive map is unavailable without
            JavaScript. Browse the ecosystem catalogue below instead.
          </p>
        </div>
      </noscript>

      <!-- Catalogue: a first-class product surface AND the accessible representation of the data. -->
      <section id="catalogue" class="catalogue" aria-label="Ecosystem catalogue"></section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
